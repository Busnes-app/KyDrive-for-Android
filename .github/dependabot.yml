version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Needs compileSdk 37; move with compileSdk in its own change (as KyPost does).
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
