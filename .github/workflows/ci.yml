name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs: a tag is a mutable pointer. Same pins as KyPost-for-Android.
jobs:
  unit:
    name: ci-unit
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before any ./gradlew: the committed wrapper jar must match Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: scripts/check-no-binaries.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      # `basic` is the MIT cache provider; the default one is proprietary.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # Never add --write-verification-metadata here: CI must fail on an unrecorded artifact.
      - name: unit tests, lint, exported-component gate
        run: ./gradlew testDebugUnitTest lintDebug checkExportedComponentsDebug checkExportedComponentsRelease
      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml
      - name: unit test report
        if: failure()
        run: |
          find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done || true

  # The only job that runs R8. A missing keep rule does not fail a build; it ships an APK that
  # throws at runtime, so the release variant is built on every PR.
  release-build:
    name: ci-release-build
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # Unsigned: nothing here is published.
      - name: assemble release
        run: ./gradlew :app:assembleRelease
      - name: no Google Play Services or Firebase code
        run: |
          set -euo pipefail
          mapping=app/build/outputs/mapping/release/mapping.txt
          test -f "$mapping"
          if grep -qE '^com\.google\.(firebase|android\.gms|mlkit)\.' "$mapping"; then
            echo "The release build contains proprietary Google code; F-Droid will refuse it." >&2
            exit 1
          fi
      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml

  # The wire layer against a real server, like kydrive-desktop's real-server job. Bump the
  # pin when the app starts using a newer server route.
  real-server:
    name: ci-real-server
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pinned public KyDrive server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/kydrive-server
          ref: 8cafb83b829f4d5ff4c67ca4bd988888cc998d11
          path: .ci/kydrive-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ci/kydrive-server/go.mod
          cache-dependency-path: .ci/kydrive-server/go.sum
      - name: build the pinned server
        working-directory: .ci/kydrive-server
        run: go build -o "$RUNNER_TEMP/kydrive-server" ./cmd/server
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: client against the real server
        env:
          KYDRIVE_SERVER_BIN: ${{ runner.temp }}/kydrive-server
        run: ./gradlew testDebugUnitTest --tests '*RealServerTest'
      # A missing binary skips the tests rather than failing them; this job must run them.
      - name: real-server tests ran
        run: |
          set -euo pipefail
          report=app/build/test-results/testDebugUnitTest/TEST-org.kysecurity.drive.core.RealServerTest.xml
          grep -q 'skipped="0"' "$report"
          ! grep -q 'tests="0"' "$report"

  instrumented:
    name: ci-lock-recreation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUSH_RELAY_URL: ''
      APNS_RELAY_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # shared with KyPost for Android
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - run: git diff --exit-code -- gradle/verification-metadata.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lock-recreation-results
          path: app/build/outputs/androidTest-results/
