name: screenshots

# Captures every screen when a PR changes one; attach the artifact's PNGs to the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/src/main/**'
      - 'scripts/screenshots.sh'
      - 'scripts/screenshot-server.sh'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pinned server as ci-real-server, for the linked screens.
      - name: pinned public KyDrive server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/kydrive-server
          ref: 30fb145cb00076e5e637bafefd6a759692ecbbf7
          path: .ci/kydrive-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ci/kydrive-server/go.mod
          cache-dependency-path: .ci/kydrive-server/go.sum
      - name: build the pinned server
        working-directory: .ci/kydrive-server
        run: go build -o "$RUNNER_TEMP/kydrive-server" ./cmd/server
      - name: install socat
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends socat
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install emulator and system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools \
            "system-images;android-36;google_apis;x86_64" > /dev/null
      - run: scripts/screenshots.sh
        env:
          KYDRIVE_SERVER_BIN: ${{ runner.temp }}/kydrive-server
      # Also after a failure: the screens captured so far show where it stopped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
