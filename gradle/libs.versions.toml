# Versions follow KyPost-for-Android, which resolves them on the same compileSdk.
# Changing any of them means regenerating gradle/verification-metadata.xml in its own commit,
# as AGENTS.md describes. Never from CI: CI must fail on an unrecorded artifact, not record it.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.18.0"
activityKtx = "1.13.0"
appcompat = "1.8.0"
material = "1.14.0"
junit = "4.13.2"
junit5 = "6.1.3"
jazzer = "0.30.0"
zxingEmbedded = "4.3.0"
orgJson = "20260814"
# The app's Ed25519 (TLS pin rollover), and the floor for AGP's own BouncyCastle transitives.
bouncycastle = "1.87"
commonsLang3 = "3.22.0"
httpclient = "4.5.14"
jose4j = "0.9.7"
jdom2 = "2.0.6.1"
guava = "33.8.0-jre"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# JUnit 5 runs the Jazzer fuzz tests; the vintage engine runs the JUnit 4 tests unchanged.
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-vintage = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jazzer-junit = { group = "com.code-intelligence", name = "jazzer-junit", version.ref = "jazzer" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
# Android ships org.json; JVM unit tests need the real implementation instead of the stub.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# Tests only: certificates for the local TLS server.
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
floor-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
floor-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
floor-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
floor-commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
floor-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpclient" }
floor-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
floor-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
floor-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[bundles]
# Constraints only raise a version; drop an entry once AGP's own request reaches it.
build-tool-floors = [
    "floor-bcprov", "floor-bcpkix", "floor-bcutil", "floor-commons-lang3",
    "floor-httpclient", "floor-jose4j", "floor-jdom2", "floor-guava",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
